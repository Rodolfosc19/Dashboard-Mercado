<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Power BI TV</title>
  <style>
    html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui}
    .badge{position:fixed;left:12px;bottom:12px;opacity:.6;font-size:14px;z-index:9999}
  </style>
</head>
<body>
  <div class="badge" id="badge"></div>

  <script>
    // ===== CONFIG =====
    const dashboards = [
      {
        name: "Relatório 1",
        url: "https://app.powerbi.com/reportEmbed?reportId=add0e0ad-09a9-4437-bea1-18eac20de109&autoAuth=true&ctid=f880a3d6-11a0-4f57-92ed-08f30cc4bf71",
        seconds: 30
      },
      {
        name: "Relatório 2",
        url: "https://app.powerbi.com/reportEmbed?reportId=560de4cc-4f2d-4ca7-aefd-386de776b5f0&autoAuth=true&ctid=f880a3d6-11a0-4f57-92ed-08f30cc4bf71",
        seconds: 30
      },
      {
        name: "Relatório 3",
        url: "https://app.powerbi.com/reportEmbed?reportId=4099d0e0-acf4-4488-a698-099074edc6cb&autoAuth=true&ctid=f880a3d6-11a0-4f57-92ed-08f30cc4bf71",
        seconds: 30
      }
    ];
    // ==================

    const KEY = "pbi_tv_next_index";

    // Descobre se já estamos em um relatório (quando a TV já foi redirecionada)
    const ref = document.referrer || "";
    const cameFromPBI = ref.includes("app.powerbi.com");

    // Se abriu direto o tv.html, escolhe o índice salvo (ou 0)
    let i = Number(localStorage.getItem(KEY) || 0);
    if (!Number.isFinite(i) || i < 0 || i >= dashboards.length) i = 0;

    const current = dashboards[i];
    const next = (i + 1) % dashboards.length;
    localStorage.setItem(KEY, String(next));

    document.getElementById("badge").textContent =
      `${current.name} — trocando em ${current.seconds}s`;

    // Espera e troca
    setTimeout(() => {
      window.location.replace(current.url);
    }, current.seconds * 1000);
  </script>
</body>
</html>
